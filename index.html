<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sobé — Checklist de Performance</title>
<link rel="icon" type="image/png" href="sobe.png">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #F7F6F2;
    --ink: #1A1A1A;
    --muted: #888;
    --line: #E0DDDA;
    --accent: #0E2347;
    --card: #FFFFFF;
    --mono: 'DM Mono', monospace;
    --sans: 'DM Sans', sans-serif;
    --display: 'Syne', sans-serif;
    --green: #1A7A45;
    --green-bg: #E6F5ED;
    --red: #C1121F;
    --red-bg: #FDEAEA;
  }

  body {
    background: var(--bg);
    font-family: var(--sans);
    color: var(--ink);
    min-height: 100vh;
    padding: 36px 20px 80px;
  }

  /* ── HEADER ── */
  .page-header {
    max-width: 820px; margin: 0 auto 28px;
    display: flex; align-items: center;
    justify-content: space-between;
    border-bottom: 2px solid var(--ink);
    padding-bottom: 16px; gap: 24px; flex-wrap: wrap;
  }
  .brand { display: flex; align-items: center; gap: 14px; }
  .brand-logo { height: 44px; width: auto; display: block; }
  .brand-text { display: flex; flex-direction: column; gap: 3px; padding-left: 14px; border-left: 1.5px solid var(--line); }
  .brand-name {
    font-family: var(--display); font-size: 22px; font-weight: 800;
    letter-spacing: -.5px; color: var(--accent); line-height: 1;
  }
  .brand-sub {
    font-family: var(--mono); font-size: 10px; color: var(--muted);
    letter-spacing: 2px; text-transform: uppercase;
  }
  .meta-fields { display: flex; gap: 20px; flex-wrap: wrap; align-items: flex-end; }
  .meta-field { display: flex; flex-direction: column; gap: 4px; }
  .meta-label { font-family: var(--mono); font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 1.5px; }
  .meta-input {
    border: none; border-bottom: 1.5px solid var(--line);
    background: transparent; font-family: var(--sans);
    font-size: 13px; color: var(--ink);
    padding: 2px 4px; width: 130px; outline: none; transition: border-color .2s;
  }
  .meta-input:focus { border-bottom-color: var(--accent); }

  /* ── PROGRESS ── */
  .progress-wrap {
    max-width: 820px; margin: 0 auto 22px;
    display: flex; align-items: center; gap: 14px;
  }
  .progress-bar { flex: 1; height: 5px; background: var(--line); border-radius: 3px; overflow: hidden; }
  .progress-fill {
    height: 100%; background: linear-gradient(90deg, var(--accent), #3A6BC9);
    border-radius: 3px; transition: width .35s ease; width: 0%;
  }
  .progress-label { font-family: var(--mono); font-size: 11px; color: var(--muted); white-space: nowrap; }

  /* ── TOOL CARD ── */
  .tool-card {
    max-width: 820px; margin: 0 auto 10px;
    background: var(--card); border: 1.5px solid var(--line);
    border-radius: 10px; overflow: hidden; transition: opacity .2s;
  }
  .tool-card.disabled { opacity: .4; }
  .tool-card.disabled .items-body,
  .tool-card:not(.open) .items-body { display: none; }
  .tool-card:not(.open) .tool-header { border-bottom: none; }

  /* ── TOOL HEADER ── */
  .tool-header {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 16px; cursor: pointer; user-select: none;
    border-bottom: 1.5px solid var(--line); transition: background .15s;
  }
  .tool-card.disabled .tool-header { border-bottom: none; }
  .tool-header:hover { background: #fafaf8; }
  .tool-emoji { font-size: 17px; width: 22px; text-align: center; flex-shrink: 0; }
  .tool-name { font-family: var(--display); font-weight: 700; font-size: 13.5px; flex: 1; letter-spacing: -.2px; color: var(--accent); }
  .tool-count { font-family: var(--mono); font-size: 11px; color: var(--muted); flex-shrink: 0; }

  /* Toggle */
  .tool-toggle { position: relative; width: 34px; height: 19px; flex-shrink: 0; }
  .tool-toggle input { opacity: 0; width: 0; height: 0; }
  .toggle-track {
    position: absolute; inset: 0; border-radius: 10px;
    background: var(--line); cursor: pointer; transition: background .2s;
  }
  .toggle-track::after {
    content: ''; position: absolute; width: 13px; height: 13px; border-radius: 50%;
    background: #fff; top: 3px; left: 3px; transition: transform .2s;
    box-shadow: 0 1px 3px rgba(0,0,0,.2);
  }
  .tool-toggle input:checked + .toggle-track { background: var(--accent); }
  .tool-toggle input:checked + .toggle-track::after { transform: translateX(15px); }
  .chevron { font-size: 10px; color: var(--muted); transition: transform .25s; flex-shrink: 0; }
  .tool-card.open .chevron { transform: rotate(180deg); }

  /* ── SECTION ── */
  .items-body { padding: 0; }
  .section-group { border-bottom: 1px solid var(--line); }
  .section-group:last-child { border-bottom: none; }
  .section-title {
    font-family: var(--mono); font-size: 9px; text-transform: uppercase;
    letter-spacing: 2px; color: var(--muted); padding: 8px 16px 5px; background: #fbfbf9;
  }

  /* ── CHECK ITEM ── */
  .check-item {
    display: flex; align-items: flex-start; gap: 12px;
    padding: 8px 16px; border-top: 1px solid var(--line);
  }
  .check-item:first-of-type { border-top: none; }

  .check-content { flex: 1; min-width: 0; }
  .check-label { font-size: 13px; line-height: 1.4; color: var(--ink); }
  .check-item.done .check-label { color: var(--muted); }


  /* ── STATUS DOT (left indicator) ── */
  .status-dot {
    width: 8px; height: 8px; border-radius: 50%;
    flex-shrink: 0; margin-top: 5px;
    background: var(--line);
    transition: background .2s;
  }
  .status-dot.d-ok    { background: var(--green); }
  .status-dot.d-issue { background: var(--red); }
  .status-dot.d-na    { background: #aaa; }

  /* ── AUTO-GROW TEXTAREA ── */
  .obs-field {
    display: block; width: 100%; margin-top: 4px;
    border: none; border-bottom: 1px dashed var(--line);
    background: transparent; font-family: var(--sans);
    font-size: 11.5px; color: #666; padding: 1px 2px 3px;
    outline: none; resize: none; overflow: hidden;
    min-height: 20px; line-height: 1.5; transition: border-color .2s;
  }
  .obs-field:focus { border-bottom-color: var(--accent); color: var(--ink); }
  .obs-field::placeholder { color: #ccc; font-style: italic; }

  /* ── STATUS BUTTONS (screen) ── */
  .status-group { display: flex; flex-direction: column; gap: 4px; flex-shrink: 0; padding-top: 1px; }
  .status-btn {
    appearance: none; -webkit-appearance: none;
    border: 1.5px solid var(--line); background: transparent;
    border-radius: 5px; font-family: var(--mono); font-size: 10px;
    padding: 4px 8px; cursor: pointer; color: var(--muted);
    transition: all .15s; white-space: nowrap; line-height: 1; text-align: center;
  }
  .status-btn:hover { border-color: #bbb; color: var(--ink); }
  .status-btn.s-ok    { background: var(--green-bg); border-color: var(--green); color: var(--green); font-weight: 600; }
  .status-btn.s-issue { background: var(--red-bg);   border-color: var(--red);   color: var(--red);   font-weight: 600; }
  .status-btn.s-na    { background: #f0f0f0; border-color: #aaa; color: #555; font-weight: 600; }

  /* ── MOBILE: status buttons in a row below the text ── */
  @media screen and (max-width: 600px) {
    body { padding: 24px 16px 64px; }
    .check-item { flex-wrap: wrap; }
    .status-group { flex-direction: row; flex-basis: 100%; padding: 0 0 2px 20px; }
    .status-btn { flex: 1; padding: 7px 8px; font-size: 11px; }
    .meta-input { width: 100%; }
    .meta-field { flex: 1 1 130px; }
  }

  /* ── PRINT STATUS BADGE (hidden on screen) ── */
  .print-badge { display: none; }

  /* ── DISABLED BANNER ── */
  .disabled-banner { display: none; padding: 10px 16px; font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .tool-card.disabled .disabled-banner { display: block; }

  /* ── ACTIONS ── */
  .actions { max-width: 820px; margin: 24px auto 0; display: flex; gap: 10px; flex-wrap: wrap; }
  .btn {
    font-family: var(--mono); font-size: 11px; letter-spacing: 1px;
    text-transform: uppercase; padding: 9px 16px; border-radius: 6px;
    cursor: pointer; border: 1.5px solid var(--ink);
    background: transparent; color: var(--ink); transition: all .2s;
  }
  .btn:hover { background: var(--ink); color: #fff; }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn-primary:hover { background: #071629; border-color: #071629; }

  /* ══════════════════════════════════════════════
     PRINT STYLES
     Key decisions:
     - @page margin: 0 removes browser header/footer (URL, date, page number)
     - padding on body provides safe area instead
     - status buttons hidden; only the active badge shows
     - obs-field hidden if empty; visible only when has content
  ══════════════════════════════════════════════ */
  @media print {
    @page { margin: 0; size: A4; }

    body {
      background: #fff !important;
      padding: 14mm 14mm 14mm 14mm;
      font-size: 12px;
    }

    /* Hide screen-only chrome */
    .btn, .actions, .chevron,
    .tool-toggle, .progress-wrap { display: none !important; }

    /* Collapsed cards still print their items */
    .tool-card:not(.open) .items-body { display: block !important; }
    .tool-card .tool-header { border-bottom: 1px solid #ddd !important; }

    /* Disabled tools vanish entirely */
    .tool-card.disabled { display: none !important; }

    /* Card resets */
    .tool-card {
      border: 1px solid #ddd;
      border-radius: 6px;
      margin-bottom: 10px;
      break-inside: avoid;
    }

    .tool-header {
      padding: 8px 12px;
      border-bottom: 1px solid #ddd;
      cursor: default;
    }

    .page-header {
      margin-bottom: 12px;
      padding-bottom: 10px;
    }

    /* Hide all 3 buttons on print */
    .status-group { display: none !important; }

    /* Show only the active badge */
    .print-badge {
      display: inline-flex;
      align-items: center;
      flex-shrink: 0;
      font-family: var(--mono);
      font-size: 9.5px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 4px;
      border: 1px solid #ccc;
      color: #888;
      background: #f5f5f5;
      white-space: nowrap;
      margin-top: 2px;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
    .print-badge.b-ok    { background: #E6F5ED; border-color: #1A7A45; color: #1A7A45; }
    .print-badge.b-issue { background: #FDEAEA; border-color: #C1121F; color: #C1121F; }
    .print-badge.b-na    { background: #f0f0f0; border-color: #aaa;    color: #555; }

    /* check-item layout on print: row with badge on right */
    .check-item {
      padding: 5px 12px;
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }

    .check-label { font-size: 11.5px; }

    /* Obs: hide if empty, show if has content */
    .obs-field {
      display: none !important;
    }
    .obs-visible {
      display: block !important;
      font-size: 10.5px;
      color: #444;
      margin-top: 4px;
      border: none;
      padding: 0;
    }
    .obs-visible strong { font-weight: 700; color: #222; }

    .section-title { padding: 5px 12px 3px; font-size: 8.5px; }

    /* Dot shows in print with color */
    .status-dot {
      display: block !important;
      width: 8px; height: 8px; border-radius: 50%;
      flex-shrink: 0; margin-top: 4px;
      background: #ddd;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
    .status-dot.d-ok    { background: #1A7A45 !important; }
    .status-dot.d-issue { background: #C1121F !important; }
    .status-dot.d-na    { background: #aaa    !important; }
  }
</style>
</head>
<body>

<header class="page-header">
  <div class="brand">
    <img class="brand-logo" src="sobe.png" alt="Sobé">
    <div class="brand-text">
      <div class="brand-name">Checklist</div>
      <div class="brand-sub">Performance de Contas</div>
    </div>
  </div>
  <div class="meta-fields">
    <div class="meta-field">
      <label class="meta-label">Cliente</label>
      <input class="meta-input" type="text" id="clientInput" placeholder="Nome do cliente">
    </div>
    <div class="meta-field">
      <label class="meta-label">Responsável</label>
      <input class="meta-input" type="text" id="ownerInput" placeholder="Seu nome">
    </div>
    <div class="meta-field">
      <label class="meta-label">Data</label>
      <input class="meta-input" type="date" id="dateInput">
    </div>
  </div>
</header>

<div class="progress-wrap">
  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  <div class="progress-label" id="progressLabel">0 / 0 itens avaliados</div>
</div>

<div id="tools-container"></div>

<div class="actions">
  <button class="btn btn-primary" onclick="preparePrint()">🖨 Imprimir / Salvar PDF</button>
  <button class="btn" onclick="resetAll()">↺ Resetar tudo</button>
</div>

<script>
const TOOLS = [
  {
    id: "ga4", emoji: "📊", name: "Google Analytics 4",
    sections: [

      { title: "Eventos e Conversões", items: [

        "Eventos de formulário e CTA disparando corretamente",
      ]},
      { title: "Integrações", items: [
        "Google Ads vinculado",
        "Search Console vinculado",
      ]},
    ]
  },
  {
    id: "gtm", emoji: "🏷️", name: "Google Tag Manager",
    sections: [
      { title: "Saúde do Container", items: [
        "Container publicado e sem tags duplicadas",

      { title: "Tags Críticas", items: [

        "Tag Google Ads / conversões disparando",
        "Tag Meta Pixel disparando",
        "Gatilhos de conversão corretos (formulário, clique CTA)",
      ]},
    ]
  },
  {
    id: "google_ads", emoji: "🎯", name: "Google Ads",
    sections: [
      { title: "Estrutura", items: [
        "Campanhas organizadas por objetivo / produto",
        "Grupos de anúncio segmentados (não misturar temas)",
        "Campanha de marca existente e ativa",
      ]},
      { title: "Palavras-chave", items: [
        "Palavras-chave negativas atualizadas",
        "Termos de pesquisa revisados — irrelevantes negativados",
        "Palavras com alto gasto e baixa conversão identificadas",
      ]},
      { title: "Leilão e Concorrência", items: [
        "Relatório de Leilão analisado",
      ]},
      { title: "Anúncios", items: [
        "Extensões configuradas (sitelinks, callouts)",

      ]},
      { title: "Performance e Investimento", items: [

        "Distribuição de investimento por campanha analisada",
        "Campanhas com melhor performance no período identificadas",

      ]},
    ]
  },
  {
    id: "navegg", emoji: "👥", name: "Navegg",
    sections: [
      { title: "Instalação e Dados", items: [

        "Integração com plataformas de mídia configurada",
      ]},
    ]
  },
  {
    id: "hotjar", emoji: "🔥", name: "Hotjar",
    sections: [
      { title: "Instalação e Dados", items: [
        "Script instalado e sessões sendo gravadas",
        "Dados de heatmap disponíveis nas páginas principais",
      ]},
    ]
  },
  {
    id: "gmb", emoji: "📍", name: "Google Meu Negócio",
    sections: [
      { title: "Perfil", items: [
        "Perfil verificado, endereço e horário corretos",
        "Fotos atualizadas",
        "Avaliações respondidas (positivas e negativas)",
      ]},
      { title: "Performance", items: [
        "Cliques para ligação e rotas analisados",
        "Avaliação média e evolução monitoradas",
        "Posts recentes no perfil",
      ]},
    ]
  },
  {
    id: "meta", emoji: "📘", name: "Meta Ads",
    sections: [
      { title: "Configuração", items: [
        "Pixel instalado e disparando sem duplicidade",
        "Conversions API (CAPI) configurada",
        "Domínio verificado no Business Manager",
      ]},
      { title: "Estrutura e Audiências", items: [
        "Campanhas por etapa de funil (topo / meio / fundo)",
        "Remarketing ativo com público adequado",
      ]},
      { title: "Performance", items: [
        "CTR, CPM e CPC analisados",
        "CPA dentro da meta do cliente",
        "Frequência de exibição controlada (alerta acima de 4)",
        "Conjuntos com melhor e pior performance identificados",
        "Distribuição de investimento por campanha revisada",
      ]},
    ]
  },
  {
    id: "tiktok", emoji: "🎵", name: "TikTok Ads",
    sections: [
      { title: "Configuração", items: [
        "Pixel instalado e eventos configurados",
      ]},
      { title: "Performance", items: [

        "CPA dentro da meta",

      ]},
    ]
  },
  {
    id: "linkedin", emoji: "💼", name: "LinkedIn Ads",
    sections: [
      { title: "Configuração", items: [
        "Insight Tag instalada no site",
        "Conversões configuradas",
      ]},
      { title: "Segmentação", items: [
        "Segmentação B2B configurada (cargo, setor, senioridade)",
      ]},
      { title: "Performance", items: [
        "CTR analisado",
        "CPL dentro da meta do cliente",
        "Campanhas com melhor e pior resultado identificadas",
      ]},
    ]
  },
  {
    id: "hotmart", emoji: "🛒", name: "Hotmart",
    sections: [
      { title: "Configuração", items: [
        "Pixel e GA4 integrados ao checkout",
        "UTMs de campanha chegando corretamente",
      ]},
      { title: "Performance de Vendas", items: [
        "Receita total, ticket médio e número de vendas revisados",
        "Origem das vendas por canal identificada",
        "Reembolsos e chargeback monitorados",
      ]},
    ]
  },

// state[key] = 'ok' | 'issue' | 'na' | null
const state = {};

function buildTools() {
  const container = document.getElementById('tools-container');
  TOOLS.forEach(tool => {
    const total = tool.sections.reduce((s, sec) => s + sec.items.length, 0);
    const card = document.createElement('div');
    card.className = 'tool-card open';
    card.id = `card-${tool.id}`;

    const bodyHTML = tool.sections.map(sec => `
      <div class="section-group">
        <div class="section-title">${sec.title}</div>
        ${sec.items.map((item, i) => {
          const key = `${tool.id}||${sec.title}||${i}`;
          state[key] = null;
          return `
            <div class="check-item" id="row-${key}">
              <span class="status-dot" id="dot-${key}"></span>
              <div class="check-content">
                <div class="check-label">${item}</div>
                <textarea class="obs-field" id="obs-${key}" placeholder="Observação…" rows="1"
                  oninput="autoGrow(this); save()"></textarea>
              </div>
              <span class="print-badge" id="badge-${key}"></span>
              <div class="status-group">
                <button class="status-btn" data-val="ok" onclick="setStatus('${key}','ok')">✓ Ok</button>
                <button class="status-btn" data-val="issue" onclick="setStatus('${key}','issue')">⚠ Problema</button>
                <button class="status-btn" data-val="na" onclick="setStatus('${key}','na')">N/A</button>
              </div>
            </div>`;
        }).join('')}
      </div>`).join('');

    card.innerHTML = `
      <div class="tool-header" onclick="toggleCard('${tool.id}')">
        <span class="tool-emoji">${tool.emoji}</span>
        <span class="tool-name">${tool.name}</span>
        <span class="tool-count" id="count-${tool.id}">0 / ${total}</span>
        <label class="tool-toggle" onclick="event.stopPropagation()" title="Ativar / desativar">
          <input type="checkbox" checked id="toggle-${tool.id}" onchange="toggleTool('${tool.id}')">
          <span class="toggle-track"></span>
        </label>
        <span class="chevron">▼</span>
      </div>
      <div class="disabled-banner">— Ferramenta não configurada. Seção ignorada.</div>
      <div class="items-body" id="body-${tool.id}">${bodyHTML}</div>`;
    container.appendChild(card);
  });
  updateProgress();
}

const STORAGE_KEY = 'sobe-checklist-v2';
const BADGE_TEXT = { ok: '✓ Ok', issue: '⚠ Problema', na: 'N/A' };

function toggleCard(id) {
  document.getElementById(`card-${id}`).classList.toggle('open');
  save();
}

function toggleTool(id) {
  const on = document.getElementById(`toggle-${id}`).checked;
  document.getElementById(`card-${id}`).classList.toggle('disabled', !on);
  updateProgress();
  save();
}

function setStatus(key, val) {
  state[key] = (state[key] === val) ? null : val;
  renderStatus(key);
  updateProgress();
  save();
}

function renderStatus(key) {
  const val = state[key];
  const row = document.getElementById(`row-${key}`);

  // screen buttons
  row.querySelectorAll('.status-btn').forEach(b => {
    b.classList.remove('s-ok','s-issue','s-na');
    if (val && b.dataset.val === val) b.classList.add(`s-${val}`);
  });

  // print badge
  const badge = document.getElementById(`badge-${key}`);
  badge.className = val ? `print-badge b-${val}` : 'print-badge';
  badge.textContent = val ? BADGE_TEXT[val] : '';

  // dot indicator
  const dot = document.getElementById(`dot-${key}`);
  dot.className = val ? `status-dot d-${val}` : 'status-dot';

  // muted label only for na
  row.classList.toggle('done', val === 'na');
}

function autoGrow(el) {
  el.style.height = 'auto';
  el.style.height = el.scrollHeight + 'px';
}

function updateProgress() {
  let total = 0, done = 0;
  TOOLS.forEach(tool => {
    if (!document.getElementById(`toggle-${tool.id}`).checked) return;
    let tDone = 0, tTotal = 0;
    tool.sections.forEach(sec => {
      sec.items.forEach((_, i) => {
        const key = `${tool.id}||${sec.title}||${i}`;
        tTotal++;
        if (state[key]) tDone++;
      });
    });
    total += tTotal; done += tDone;
    document.getElementById(`count-${tool.id}`).textContent = `${tDone} / ${tTotal}`;
  });
  const pct = total ? (done / total * 100) : 0;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressLabel').textContent = `${done} / ${total} itens avaliados`;
}

// ── PERSISTENCE (localStorage) ──
function save() {
  const obs = {};
  document.querySelectorAll('.obs-field').forEach(f => {
    if (f.value) obs[f.id.slice(4)] = f.value;
  });
  const data = {
    client: document.getElementById('clientInput').value,
    owner:  document.getElementById('ownerInput').value,
    date:   document.getElementById('dateInput').value,
    status: Object.fromEntries(Object.entries(state).filter(([, v]) => v)),
    obs,
    disabled:  TOOLS.filter(t => !document.getElementById(`toggle-${t.id}`).checked).map(t => t.id),
    collapsed: TOOLS.filter(t => !document.getElementById(`card-${t.id}`).classList.contains('open')).map(t => t.id),
  };
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch (e) {}
}

function load() {
  let data = null;
  try { data = JSON.parse(localStorage.getItem(STORAGE_KEY)); } catch (e) {}
  if (!data) return;

  document.getElementById('clientInput').value = data.client || '';
  document.getElementById('ownerInput').value  = data.owner  || '';
  if (data.date) document.getElementById('dateInput').value = data.date;

  Object.entries(data.status || {}).forEach(([key, val]) => {
    if (!(key in state)) return;
    state[key] = val;
    renderStatus(key);
  });
  Object.entries(data.obs || {}).forEach(([key, val]) => {
    const f = document.getElementById(`obs-${key}`);
    if (f) { f.value = val; autoGrow(f); }
  });
  (data.disabled || []).forEach(id => {
    const t = document.getElementById(`toggle-${id}`);
    if (t) { t.checked = false; document.getElementById(`card-${id}`).classList.add('disabled'); }
  });
  (data.collapsed || []).forEach(id => {
    const c = document.getElementById(`card-${id}`);
    if (c) c.classList.remove('open');
  });
  updateProgress();
}

// ── PRINT ──
function pdfTitle() {
  const client = document.getElementById('clientInput').value.trim();
  const d = document.getElementById('dateInput').value; // yyyy-mm-dd
  const date = d ? d.split('-').reverse().join('-') : '';
  return ['Checklist', client, date].filter(Boolean).join(' – ');
}

function preparePrint() {
  // For each obs-field: if has content, add a plain div so print shows it
  document.querySelectorAll('.obs-visible').forEach(d => d.remove());
  document.querySelectorAll('.obs-field').forEach(el => {
    const txt = el.value.trim();
    if (!txt) return;
    const div = document.createElement('div');
    div.className = 'obs-visible';
    const strong = document.createElement('strong');
    strong.textContent = 'Obs:';
    div.append(strong, ' ' + txt);
    el.parentNode.insertBefore(div, el);
  });

  // Browsers use document.title as the default PDF filename
  const original = document.title;
  document.title = pdfTitle();
  window.addEventListener('afterprint', () => { document.title = original; }, { once: true });
  window.print();
}

function resetAll() {
  if (!confirm('Resetar todos os itens?')) return;
  Object.keys(state).forEach(k => { state[k] = null; renderStatus(k); });
  document.querySelectorAll('.obs-field').forEach(f => { f.value = ''; f.style.height = 'auto'; });
  document.querySelectorAll('.obs-visible').forEach(d => d.remove());
  document.getElementById('clientInput').value = '';
  document.getElementById('ownerInput').value = '';
  document.getElementById('dateInput').valueAsDate = new Date();
  TOOLS.forEach(t => {
    document.getElementById(`toggle-${t.id}`).checked = true;
    document.getElementById(`card-${t.id}`).className = 'tool-card open';
  });
  try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
  updateProgress();
}

document.getElementById('dateInput').valueAsDate = new Date();
buildTools();
load();
['clientInput', 'ownerInput', 'dateInput'].forEach(id =>
  document.getElementById(id).addEventListener('input', save));
</script>
</body>
